<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arch &amp; Ink Studio Chat</title>
<meta name="studio-chat-api-url" content="https://pay-methodology-tower-sing.trycloudflare.com/api/chat">
<meta name="calendly-event-url" content="https://calendly.com/agencialabsautomations/brow-consultation-demo">
<style>
:root{font-family:system-ui,sans-serif;color:#211b2d;background:#f1edf5;color-scheme:light;line-height:1.45}
*{box-sizing:border-box} body{margin:0} button,textarea{font:inherit}
main{max-width:530px;margin:24px auto;background:#fff;border:1px solid #e1d8e8;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;height:calc(100dvh - 48px);min-height:400px}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #eee8f1}
.avatar{width:42px;height:42px;border-radius:50%;background:#4e285f;color:white;display:grid;place-items:center;flex:none;font-weight:700}
h1,p{margin:0} h1{font-size:1.06rem;line-height:1.25} header p{font-size:.875rem;color:#61566a;margin-top:3px}.identity{flex:1;min-width:0}
button,.bookLink{cursor:pointer;border:1px solid #e5ddeb;background:#fff;color:#532768;border-radius:999px;padding:8px 13px;font-weight:650;text-decoration:none;white-space:nowrap}
button:hover,.bookLink:hover{background:#f3e8f7}button:focus-visible,a:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #9054ab;outline-offset:2px}button:disabled{opacity:.6;cursor:default}
#reset{padding:7px 10px;font-size:.875rem}
.conversation{flex:1;display:flex;flex-direction:column;min-height:0}
.messages{display:flex;flex:1;flex-direction:column;gap:10px;padding:16px;min-height:0;overflow:auto;overscroll-behavior:contain}
.bubble{padding:10px 14px;border-radius:20px 20px 20px 6px;background:#f1edf4;max-width:85%;overflow-wrap:anywhere;white-space:pre-wrap;align-self:flex-start}
.customer{background:#623779;color:#fff;border-radius:20px 20px 6px 20px;align-self:flex-end}
#activity{padding:0 16px;color:#63576d;font-size:.875rem}
#activity:not(:empty){padding-bottom:8px}
.sample{display:flex;gap:7px;overflow:auto;scrollbar-width:thin;padding:4px 14px 10px}
.sample button{font-size:.875rem;min-height:36px}
form{display:flex;align-items:flex-end;gap:8px;padding:10px 14px max(12px,env(safe-area-inset-bottom));border-top:1px solid #eee8f1}
textarea{flex:1;min-width:0;min-height:44px;max-height:108px;padding:10px 14px;resize:none;border:1px solid #e5ddeb;border-radius:22px;background:#faf8fc;font-size:1rem}
.send,.bookLink{background:#623779;color:white;border-color:#623779}.send{min-height:44px}.send:hover,.bookLink:hover{background:#4e285f}
details{border-top:1px solid #eee8f1;padding:8px 16px;color:#63576d}
summary{cursor:pointer;font-size:.875rem;width:fit-content}
dl{margin:8px 0 2px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.875rem}dd{margin:0;font-weight:650;overflow-wrap:anywhere}
#status{color:#512866}.bookLink{align-self:flex-start;margin-top:6px}
dialog{width:min(92vw,760px);max-width:none;height:min(90dvh,820px);max-height:none;padding:0;border:1px solid #e1d8e8;border-radius:22px;background:white;color:inherit}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:#211b2d99}
.bookingHeader{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid #eee8f1}
.bookingHeader h2{font-size:1rem;margin:0}
.bookingFrame{width:100%;flex:1;min-height:0;border:0}
@media(max-width:600px){dialog{width:100%;height:100dvh;margin:0;border:0;border-radius:0}}
@media(max-width:600px){main{margin:0;max-width:none;width:100%;height:100dvh;border:0;border-radius:0}header{padding-top:max(12px,env(safe-area-inset-top))}}
</style>
<main>
  <header>
    <span class="avatar" aria-hidden="true">A&amp;I</span>
    <div class="identity"><h1>Arch &amp; Ink</h1><p>Studio assistant · Demo</p></div>
    <button id="reset" type="button">New chat</button>
  </header>
  <section class="conversation" aria-label="Conversation">
    <div class="messages" id="messages" role="log" aria-label="Chat messages"></div>
    <p id="activity" role="status"></p>
    <div class="sample" aria-label="Sample messages">
      <button type="button" data-message="Microblading rate ethra?">Price</button>
      <button type="button" data-message="Saturday slot undo?">Book a visit</button>
      <button type="button" data-message="Sunday open aano?">Hours</button>
      <button type="button" data-message="What is the cancellation policy?">Cancellations</button>
      <button type="button" data-message="ടച്ച് അപ്പിന് എത്രയാണ്?">Malayalam</button>
    </div>
    <details><summary>Lead preview <span id="status"></span></summary>
      <dl><dt>Service</dt><dd id="service">—</dd>
        <dt>Requested date or time</dt><dd id="preferredTime">—</dd></dl>
    </details>
    <form id="chat">
      <textarea id="message" aria-label="Your message" placeholder="Message…" maxlength="1000" rows="1" required></textarea>
      <button class="send" type="submit">Send</button>
    </form>
  </section>
  <dialog id="booking" aria-labelledby="bookingTitle">
    <div class="bookingHeader">
      <h2 id="bookingTitle">Book your brow consultation</h2>
      <button id="closeBooking" type="button">Back to chat</button>
    </div>
    <iframe class="bookingFrame" id="bookingFrame" title="Calendly consultation booking"></iframe>
  </dialog>
</main>
<script>
const form = document.querySelector('#chat');
const input = document.querySelector('#message');
const messages = document.querySelector('#messages');
const activity = document.querySelector('#activity');
const reset = document.querySelector('#reset');
const configuredApi = document.querySelector('meta[name="studio-chat-api-url"]').content.trim();
const localHost = ['localhost', '127.0.0.1'].includes(location.hostname);
const chatApi = configuredApi || (localHost ? '/api/chat' : '');
const bookingUrl = document.querySelector('meta[name="calendly-event-url"]').content.trim();

const bookingDialog = document.querySelector('#booking');
const bookingFrame = document.querySelector('#bookingFrame');
document.querySelector('#closeBooking').addEventListener('click', () => bookingDialog.close());

function openBooking() {
  if (!bookingFrame.hasAttribute('src')) {
    bookingFrame.src = bookingUrl;
  }
  bookingDialog.showModal();
}

function addBookingButton() {
  if (!bookingUrl) return;
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'bookLink';
  button.textContent = 'Book your brow consultation';
  button.addEventListener('click', openBooking);
  messages.append(button);
  messages.scrollTop = messages.scrollHeight;
}

const controls = [...document.querySelectorAll('.send, [data-message], #reset')];
let history = [];
let previousReply = '';
let lastGreeting = '';
let sending = false;

function addMessage(text, type = 'assistant') {
  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + type;
  bubble.textContent = text;
  messages.append(bubble);
  messages.scrollTop = messages.scrollHeight;
}
function updateLead(data) {
  document.querySelector('#status').textContent = data.status ? '· ' + data.status : '';
  document.querySelector('#service').textContent = data.service || '—';
  document.querySelector('#preferredTime').textContent = data.preferredTime || '—';
}
function variedLine(lines, previous) {
  const fresh = lines.filter(line => line !== previous);
  return fresh[Math.floor(Math.random() * fresh.length)];
}

function newChat() {
  history = [];
  previousReply = '';
  input.value = '';
  messages.replaceChildren();
  activity.textContent = '';
  updateLead({});
  lastGreeting = variedLine([
    'Hi! I’m the Arch & Ink studio assistant. What can I help you with?',
    'Hey, welcome to Arch & Ink! Got a question about brows or booking?',
    'Hi there! I’m here to help with prices, brow services, or planning a visit.'
  ], lastGreeting);
  addMessage(lastGreeting);
}
async function send(message) {
  message = message.trim();
  if (!message || sending) return;
  if (!chatApi) {
    activity.textContent = 'Live chat is awaiting its server connection.';
    return;
  }
  sending = true;
  messages.querySelector('.bookLink')?.remove();
  controls.forEach(control => control.disabled = true);
  addMessage(message, 'customer');
  input.value = '';
  activity.textContent = 'Typing…';
  const typingDelay = new Promise(resolve => setTimeout(resolve, 3000));
  try {
    const response = await fetch(chatApi, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message, previous: history.slice(-8), previousReply}),
      signal: AbortSignal.timeout(22000)
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error);
    const browsing = /^(?:i(?:['’]m| am)\s+)?(?:just (?:checking|looking|browsing)(?: for now)?|not ready to book(?: yet)?|no thanks)[.!\s]*$/i.test(message);
    if (browsing && !data.fallback && data.status !== 'Human Review') {
      data.status = 'Cold';
      data.reply = variedLine([
        'Of course. If you have any questions later, I’m here to help.',
        'No worries, take your time.',
        'Totally fine. You can come back to this whenever you’re ready.'
      ], previousReply);
    }
    await typingDelay;
    addMessage(data.reply);
    if (['Warm', 'Hot'].includes(data.status) && !data.fallback) addBookingButton();
    updateLead(data);
    if (data.fallback) {
      if (!input.value) input.value = message;
    } else {
      history = [...history.slice(-7), message];
      previousReply = data.reply;
    }
    activity.textContent = '';
  } catch {
    await typingDelay;
    if (!input.value) input.value = message;
    activity.textContent = 'Couldn’t get a reply. Your message is ready to retry.';
  } finally {
    sending = false;
    controls.forEach(control => control.disabled = false);
    input.focus();
  }
}
form.addEventListener('submit', event => { event.preventDefault(); send(input.value); });
input.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    form.requestSubmit();
  }
});
document.querySelectorAll('[data-message]').forEach(button => {
  button.addEventListener('click', () => {
    if (!chatApi && bookingUrl && button.textContent === 'Book a visit') openBooking();
    else send(button.dataset.message);
  });
});
reset.addEventListener('click', () => { newChat(); input.focus(); });
newChat();
</script>
</html>
